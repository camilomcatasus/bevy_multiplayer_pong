[package]
name = "bevy_multiplayer_pong"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.2"
bevy_asset_loader = "0.22.0"
bevy_ggrs = "0.17.0"
bevy_matchbox = { version = "0.11.0", features = ["ggrs"]}
log = "0.4.27"
matchbox_socket = { version ="0.11.0"}
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_ggrs = { version = "0.17", features=["wasm-bindgen"]}
web-sys = "0.3"

[profile.dev.package."*"]
opt-level = 2
