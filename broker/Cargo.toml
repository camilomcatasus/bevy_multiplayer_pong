[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
dotenv = "0.15.0"
lazy_static = "1.5.0"
lightyear = { version = "0.25.5", features = ["netcode"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
tokio = { version = "1.48.0", features = ["full"]}
toml = "0.9.8"
tower = "0.5.2"
common = { path = "../common/"}
tower-http = { version = "0.6.6", features = ["trace"] }
log = "0.4.28"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
