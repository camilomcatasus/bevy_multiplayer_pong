[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17"
bevy_asset_loader = "0.22.0"
lightyear = { version="0.25.3", features=["netcode", "udp"] }
log = "0.4.27"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.145"
common = { path = "../common", features = ["bevy"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"

[profile.dev.package."*"]
opt-level = 2


