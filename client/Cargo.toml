[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17" }
bevy_asset_loader = "0.22.0"
lightyear = { version="0.25.3", features=["netcode", "udp"] }
log = "0.4.27"
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.145"
common = { path = "../common", features = ["bevy"]}
http-types = "2.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

